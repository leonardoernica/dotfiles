# Garimpo — busca semântica local (SUPER+D).
# Todas as chaves são opcionais; os valores comentados são os padrões.

# Pastas indexadas. Pastas ocultas, segredos (~/.ssh, secrets/, *.pem, .env…),
# node_modules, caches e pastas tipo dataset são ignorados automaticamente.
# roots = ["~/Documents", "~/Documentos", "~/Downloads", "~/Imagens", "~/Pictures",
#          "~/Área de trabalho", "~/Desktop", "~/Vídeos", "~/Videos", "~/Músicas", "~/Music", "~/study"]

# Busca de código é opcional (como no DigUp): liste pastas de projetos e pesquise com "code:".
# Respeita .gitignore. Exemplo: code_roots = ["~/projects"]
# code_roots = []

# Padrões glob extras a ignorar, ex.: ["*/Documents/Codex/*/work/*"]
# exclude = []

# Embeddings locais: llama.cpp + EmbeddingGemma 2 (garimpo setup / garimpo-embed.service).
# Trocar "model" refaz os vetores reaproveitando o texto já extraído.
# server = "http://127.0.0.1:8765"
# model = "embeddinggemma-2-Q8_0"
# dimensions = 768         # Matryoshka: 512 ou 256 economizam espaço com pouca perda
# threads = 0              # 0 = metade dos núcleos

# images = true            # fotos e capturas pelo conteúdo visual
# videos = true            # frames e trilha sonora de vídeos (abre no momento exato no mpv)
# audio = true             # músicas e gravações em janelas de 30 s
# audio_max_windows = 120
# ocr = true               # texto de capturas de tela e PDFs escaneados (tesseract)
# pdf_first_pages = 30     # primeira passada; o restante vem depois dos outros arquivos
# pdf_max_pages = 2000
# video_max_frames = 40
# pause_on_battery = false
# rescan_seconds = 600     # varredura de segurança; mudanças chegam em segundos via inotify
# editor = "code"          # code, cursor, codium ou zed: abre código na linha certa
