font_family      JetBrainsMono Nerd Font
font_size 10.0

background_opacity 0.85

enable_audio_bell no

# Paste directly into the prompt without Kitty's confirmation dialog. Dangerous
# terminal control codes are still neutralized, and Enter remains manual.
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes

scrollback_lines 10000

wheel_scroll_multiplier 8

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
